<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivo Faro</title>
<style>
:root{--paper:#f2e9d8;--ink:#2b2620;--red:#e0453a;--teal:#5eead4;--amb:#ffb703}
*{box-sizing:border-box}
body{margin:0;background:#070d1a;color:var(--teal);font:16px/1.5 "Courier New",monospace;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(#5eead412 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#5eead412 1px,transparent 1px) 0 0/40px 40px,radial-gradient(circle at 50% 0,#12315a,#070d1a 70%);animation:pan 6s linear infinite}
#bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0005 2px 3px)}
@keyframes pan{to{background-position:0 40px,40px 0,0 0}}
#wrap{max-width:520px;margin:auto;padding:12px 12px 60px}
.hud{display:flex;justify-content:space-between;align-items:center;color:var(--amb);font-weight:700;letter-spacing:.08em;font-size:.85rem}
.hud button{background:none;border:0;font-size:1.1rem;cursor:pointer}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px;perspective:400px}
.chip{width:1.9rem;height:2.3rem;display:grid;place-items:center;border:2px solid #5eead455;border-radius:6px;color:#5eead455;font-weight:700;background:#0b1626}
.chip.on{border-color:var(--teal);color:var(--amb);background:#0e2a35;box-shadow:0 0 10px #5eead455}
.chip.pop{animation:pop .7s}.chip.used{opacity:.25}
@keyframes pop{0%{transform:rotateY(90deg) scale(1.5)}60%{transform:rotateY(-15deg)}100%{transform:none}}
.card{background:var(--paper);color:var(--ink);border-radius:4px 14px 4px 4px;padding:18px;position:relative;box-shadow:0 6px 0 #0008,0 0 30px #5eead422;animation:in .5s cubic-bezier(.2,.9,.3,1.2)}
.card:before{content:"";position:absolute;top:-10px;left:0;width:90px;height:12px;background:var(--paper);border-radius:6px 6px 0 0}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.96)}}
h1{font-size:1.3rem;margin:0 0 6px;animation:gl 4s infinite}
@keyframes gl{0%,92%,100%{text-shadow:none}94%{text-shadow:2px 0 var(--red),-2px 0 #2bb}96%{text-shadow:-2px 0 var(--red),2px 0 #2bb;transform:translateX(2px)}}
.stamp{position:absolute;top:12px;right:12px;border:3px solid var(--red);color:var(--red);padding:0 6px;font-weight:700;font-size:.8rem;transform:rotate(8deg);animation:st .5s .3s both}
@keyframes st{from{transform:rotate(8deg) scale(3);opacity:0}}
.room{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.room button{font-size:2rem;background:#e2d6bd;border:2px solid #cbbd9e;border-radius:8px;padding:4px 0;cursor:pointer;transition:transform .15s}
.room button:hover,.room button:focus-visible{transform:translateY(-3px) rotate(-3deg)}
.room button.seen{background:#cfe9dc}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.log{min-height:3.4em;background:#070d1a;color:var(--teal);padding:8px;border-radius:6px;margin:8px 0;white-space:pre-wrap}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0}
input{font:inherit;font-size:1.4rem;text-align:center;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);padding:6px}
.d{width:3rem}.t{width:100%;letter-spacing:.2em;text-transform:uppercase}
.go,.opt,.tile{display:block;width:100%;margin:6px 0;padding:10px;border:2px solid var(--ink);border-radius:8px;background:var(--amb);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.go:active,.opt:active,.tile:active{transform:translateY(4px);box-shadow:none}
.opt,.tile{background:#fff;text-align:left}.tile.ok{background:#8fe3c0}
.ghost{background:none;border:0;color:#6b5d44;text-decoration:underline;cursor:pointer;padding:0;margin-top:8px}
.cipher{font-size:1.8rem;letter-spacing:.3em;text-align:center;background:#070d1a;color:var(--teal);padding:10px;border-radius:6px;text-shadow:0 0 8px var(--teal)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pad{height:78px;border-radius:14px;border:3px solid var(--ink);opacity:.5;cursor:pointer;transition:all .15s}
.pad.lit{opacity:1;filter:brightness(1.4);transform:scale(1.07);box-shadow:0 0 26px currentColor}
.slots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sw{display:flex;gap:4px}
.slot{width:2.2rem;height:2.8rem;border:0;border-bottom:4px solid var(--ink);background:#fff8;font:700 1.4rem "Courier New",monospace;color:var(--ink);border-radius:4px 4px 0 0}
.tray{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tray .chip{width:2.4rem;height:2.8rem;font-size:1.3rem;cursor:pointer;border-color:var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.big{font-size:2.1rem;text-align:center;color:var(--red);font-weight:700;margin:8px 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.big span{animation:drop .6s both}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-20deg)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#tick{position:fixed;bottom:0;left:0;right:0;background:#070d1aee;border-top:1px solid #5eead466;padding:6px 12px;font-size:.78rem;color:#7dd3c0;text-align:center}
#tick span{animation:fd .8s}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.cf{position:fixed;top:-2rem;font-size:1.6rem;animation:fall 4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.card{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#030812ee;backdrop-filter:blur(6px);animation:fd2 .3s;padding:20px;cursor:pointer}
@keyframes fd2{from{opacity:0}}
.ovc{text-align:center;max-width:420px}
.ove{font-size:7rem;animation:zoom .6s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 0 24px var(--teal))}
@keyframes zoom{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.ovt{font-size:1.05rem;color:var(--teal);min-height:5em;text-shadow:0 0 8px #5eead488}
.key{display:inline-block;color:#fff;background:var(--red);padding:0 .4em;border-radius:4px;font-size:1.8rem;margin:0 4px;animation:kp 1s infinite;text-shadow:none}
@keyframes kp{50%{box-shadow:0 0 22px var(--red);transform:scale(1.18)}}
.ovh{color:#7dd3c0;font-size:.75rem;margin-top:14px}
.wipe{position:fixed;top:0;bottom:0;left:0;width:30vw;z-index:40;pointer-events:none;background:linear-gradient(90deg,#0000,#5eead455,#0000);animation:wp .6s forwards}
@keyframes wp{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.prog{height:4px;background:#5eead422;border-radius:2px;margin:6px 0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amb));box-shadow:0 0 10px var(--teal);transition:width .8s}
.bar2{font-weight:700;color:#6b5d44;text-align:center}
</style></head><body><div id="bg"></div><canvas id="fx"></canvas>
<div id="wrap"><div class="hud" id="hud"></div><div class="prog"><i id="pg"></i></div><div class="chips" id="chips"></div><main id="app"></main></div>
<footer id="tick"><span></span></footer>
<script>
const $=q=>document.querySelector(q),app=$('#app'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Datos del link: ?d=<base64url de JSON {n,a,r,c,f}>
function load(){try{const d=new URLSearchParams(location.search).get('d');if(!d)return{};
const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(d.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));return j&&typeof j==='object'?j:{}}catch(e){return{}}}
const P=load(),cl=(v,d)=>typeof v==='string'&&v.trim()?v.trim().slice(0,40):d;
const name=cl(P.n,'Agente'),nick=cl(P.a,name),joke=cl(P.c,''),fecha=cl(P.f,''),fem=P.r==='a';
const tio=fem?'TÍA':'TÍO',L=('VASASERTI'+(fem?'A':'O')).split(''),order=[...L.keys()].sort(()=>Math.random()-.5);
let step=0,got=0,prev=0,hints=0,hinted=false,mute=false,tw,ctx;
// Sonido y efectos
function beep(f,d=.12,t='square'){if(mute||!window.AudioContext)return;try{ctx=ctx||new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}
function say(t){const l=$('.log');if(!l)return;clearInterval(tw);if(RM){l.textContent=t;return}let i=0;l.textContent='';tw=setInterval(()=>{l.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(tw)},16)}
function burst(){if(RM)return;for(let i=0;i<16;i++){const s=el('span','cf','✦');s.style.cssText='top:40vh;left:50vw;animation:none;color:#ffb703';document.body.append(s);const a=Math.random()*6.28,r=80+Math.random()*120;s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:900}).onfinish=()=>s.remove()}}
function hud(){$('#pg').style.width=(step>5?100:got*10)+'%';const h=$('#hud');h.replaceChildren(el('span','','ARCHIVO FARO'),el('span','',step>5?'DESCLASIFICADO':'NIVEL '+(step+1)+'/6'));
 const m=el('button','',mute?'🔇':'🔊');m.setAttribute('aria-label','Sonido');m.onclick=()=>{mute=!mute;hud()};h.append(m);
 $('#chips').replaceChildren(...order.map((o,i)=>el('div','chip'+(i<got?' on':'')+(i>=prev&&i<got?' pop':''),i<got?L[o]:'?')))}
function screen(title,intro,body,hint){hinted=false;const c=el('section','card');c.append(el('span','stamp','CLASIFICADO'),el('h1','',title),el('p','',intro),body);
 if(hint){const h=el('p','');h.hidden=true;const b=el('button','ghost','¿Pista? (costo: tu dignidad)');b.onclick=()=>{if(!hinted){hints++;hinted=true}h.textContent=hint;h.hidden=false};c.append(b,h)}
 app.replaceChildren(c);hud();wipe()}
function win(m){flash('#3ecf8e');prev=got;got+=2;step++;hud();beep(660,.15);setTimeout(()=>beep(880,.2),150);burst();say('> '+m+'\n> Letras desbloqueadas: '+order.slice(prev,got).map(o=>L[o]).join(' '));setTimeout(next,2400)}
function bad(m){flash('#e0453a');beep(120,.25,'sawtooth');say('> '+m);const c=$('.card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const flash=c=>{if(!RM)document.body.animate([{boxShadow:'inset 0 0 140px '+c},{boxShadow:'inset 0 0 0 '+c}],{duration:500})};
function wipe(){if(RM)return;const w=el('div','wipe');document.body.append(w);setTimeout(()=>w.remove(),700);beep(300,.08,'triangle')}
// Inspección expandida con texto que se descifra
function inspect(e,t){beep(300,.1,'triangle');let id;const o=el('div','ov'),c=el('div','ovc'),tx=el('div','ovt');
 c.append(el('div','ove',e),tx,el('div','ovh','toca para cerrar · Esc'));o.append(c);document.body.append(o);
 const k=ev=>{if(ev.key==='Escape')close()},close=()=>{clearInterval(id);o.remove();removeEventListener('keydown',k)};o.onclick=close;addEventListener('keydown',k);
 const m=t.match(/^(.*?dígito: )(\d)(.*)$/),full=m?m[1]:t,G='█▓▒░#%&@01';let i=0;
 id=setInterval(()=>{i+=2;if(RM)i=full.length;tx.textContent=full.slice(0,i)+Array.from({length:Math.max(0,Math.min(8,full.length-i))},()=>G[Math.random()*G.length|0]).join('');
  if(i>=full.length){clearInterval(id);tx.textContent=full;if(m){tx.append(el('span','key',m[2]));beep(880,.2);tx.append(m[3])}}},30)}
// Reto 1: candado 3907
const items=[['🗄️','Archivero. Contiene 400 memos sobre grapadoras.'],['🖼️','Retrato de familia. Atrás, con letra torcida: "1.er dígito: 3". Hay un hueco en el marco para uno más.'],['🪴','Una planta. Dice no saber nada.'],['📞','Teléfono. Suena ocupado, como siempre.'],
['☕','Café descafeinado. Muy sospechoso.'],['🍼','Biberón en el estante, medio vacío. En la etiqueta: "2.º dígito: 9".'],['🧦','Calcetín minúsculo. Seguro es de un hámster.'],['📅','Calendario con un círculo rojo. A lápiz: "4.º dígito: 7".'],
['💼','Maletín vacío. Nota: "no abrir el maletín".'],['🧸','Peluche tras la planta. En la etiqueta: "3.er dígito: 0".'],['🔦','Linterna sin pilas. Útil como adorno.'],['🚪','Puerta cerrada con candado de 4 dígitos.'],
['🎵','Cajita de música. Suena una nana desafinada.'],['🧶','Lana a medio tejer. Nadie sabe quién empezó.'],['🧩','Puzzle de piezas enormes. "Mayores de 0 años".'],['🛒','Carrito de archivos. Alguien le puso cinturón.']];
function reto1(){const b=el('div'),room=el('div','room'),log=el('div','log','> Revisa la oficina. Toca los objetos.');
 items.forEach(([e,t])=>{const x=el('button','',e);x.setAttribute('aria-label','Inspeccionar');x.onclick=()=>{x.classList.add('seen');inspect(e,t)};room.append(x)});
 const row=el('div','row'),ins=[0,1,2,3].map(()=>{const i=el('input','d');i.maxLength=1;i.inputMode='numeric';i.setAttribute('aria-label','dígito');row.append(i);return i});
 ins.forEach((i,k)=>i.oninput=()=>{if(i.value&&ins[k+1])ins[k+1].focus()});
 const g=el('button','go','Abrir candado');g.onclick=()=>ins.map(i=>i.value).join('')==='3907'?win('Candado abierto.'):bad('Código incorrecto. El candado se ríe de ti.');
 b.append(room,row,g,log);screen('Nivel 1: La oficina del jefe','Encuentra los 4 dígitos del candado, en el orden que indican las pistas.',b,'Algunos objetos son decoración y otros esconden un número.')}
// Reto 2: César +3 (BRUJULA)
function reto2(){const b=el('div'),i=el('input','t');i.setAttribute('aria-label','respuesta');b.append(el('div','cipher','EUXMXOD'),i);
 const g=el('button','go','Descifrar');g.onclick=()=>norm(i.value)==='BRUJULA'?win('Mensaje descifrado.'):bad('Texto ilegible. Intenta otra vez.');
 b.append(g,el('div','log','> Mensaje interceptado. Una palabra indica la dirección.'));screen('Nivel 2: Mensaje en clave','Descifra la palabra del archivo interceptado.',b,'Cada letra se movió 3 lugares hacia adelante. Retrocede 3: la E pasa a ser B.')}
// Reto 3: señal (Simon)
function reto3(){const col=['#e0453a','#ffb703','#3ecf8e','#4aa3ff'],fr=[262,330,392,523],lens=[3,5,7];let rd=0,at=0,lock=true;
 const mk=()=>Array.from({length:lens[rd]},()=>Math.random()*4|0);let seq=mk();
 const b=el('div'),g=el('div','pads'),info=el('div','bar2'),upd=()=>{info.textContent='Señal '+(rd+1)+'/3 · '+lens[rd]+' pulsos'};upd();
 const fl=i=>{beep(fr[i],.25,'sine');pads[i].classList.add('lit');setTimeout(()=>pads[i].classList.remove('lit'),240)};
 const play=async()=>{lock=true;at=0;say('> Escucha…');const sp=450-rd*80;for(const s of seq){await sleep(sp);fl(s)}await sleep(300);lock=false;say('> Tu turno. Repite la señal.')};
 const pads=col.map((c,i)=>{const p=el('button','pad');p.style.background=c;p.style.color=c;p.setAttribute('aria-label','Canal '+(i+1));
  p.onclick=()=>{if(lock)return;fl(i);if(i===seq[at]){if(++at===seq.length){lock=true;if(rd<2){rd++;seq=mk();at=0;upd();say('> Señal completada. La siguiente es más larga y más rápida…');setTimeout(()=>beep(700,.2),300);setTimeout(play,2200)}else win('Señal interceptada.')}}else{at=0;lock=true;bad('Señal perdida. Pulsa reproducir para escuchar de nuevo.')}};g.append(p);return p});
 const go=el('button','go','Reproducir señal');go.onclick=play;
 b.append(info,g,go,el('div','log','> Canal de radio activo.'));screen('Nivel 3: Interceptar la señal','Supera 3 señales: cada una es más larga y más rápida que la anterior.',b,'Puedes volver a escuchar la señal las veces que quieras.')}
// Reto 4: orden del trámite
function reto4(){const ord=['📬 Llega el sobre','🔍 Se revisa','🤐 Se guarda en secreto','🚪 Se abre en el momento justo'];let n=0;const b=el('div');
 [...ord].sort(()=>Math.random()-.5).forEach(t=>{const x=el('button','tile',t);x.onclick=()=>{if(t===ord[n]){beep(520+n*80,.1);x.classList.add('ok');x.disabled=true;if(++n===ord.length)win('Secuencia validada.')}
  else{n=0;b.querySelectorAll('.tile').forEach(y=>{y.classList.remove('ok');y.disabled=false});bad('Orden incorrecto. Se reinicia el trámite.')}};b.append(x)});
 b.append(el('div','log','> Ordena el procedimiento.'));screen('Nivel 4: Procedimiento','Toca los pasos en el orden correcto.',b,'Todo empieza cuando algo llega a tu escritorio.')}
// Reto 5: perfil
function reto5(){const b=el('div');
 [[nick+' (obvio)',1],['El gato del vecino',0,'Rechazado. El gato duerme 18 horas al día y no tiene huellas registradas.'],['Nadie, es imposible',0,'Error: el sistema no acepta rendirse. Intenta otra vez.'],['Un pingüino con corbata',0,'Rechazado. Los pingüinos no pasan el filtro de seguridad.'],['Un fantasma muy educado',0,'Rechazado. No hay forma de verificar su identidad (ni su sombra).']].sort(()=>Math.random()-.5).forEach(([t,ok,m])=>{const x=el('button','opt',t);x.onclick=()=>ok?win('Identidad confirmada.'):bad(m);b.append(x)});
 b.append(el('div','log','> Última verificación.'));screen('Nivel 5: Perfil del candidato','¿Quién es la persona ideal para recibir este archivo?',b,'Piensa en quién tiene el expediente delante.')}
// Reto 6: ordenar las letras en la frase final
function reto6(){const wl=[3,1,3,3],sl=Array(10).fill(null),used=Array(10).fill(false),b=el('div'),sw=el('div','slots'),tr=el('div','tray');
 const draw=()=>{sw.replaceChildren();let k=0;wl.forEach(n=>{const w=el('span','sw');for(let j=0;j<n;j++){const idx=k++,s=el('button','slot',sl[idx]==null?'':L[order[sl[idx]]]);s.setAttribute('aria-label','Casilla '+(idx+1));s.onclick=()=>{if(sl[idx]!=null){used[sl[idx]]=false;sl[idx]=null;draw()}};w.append(s)}sw.append(w)});
  tr.replaceChildren(...order.map((o,i)=>{const c=el('button','chip on'+(used[i]?' used':''),L[o]);c.disabled=used[i];c.onclick=()=>{const e=sl.indexOf(null);if(e<0)return;sl[e]=i;used[i]=true;beep(500,.08);draw();if(!sl.includes(null))chk()};return c}))};
 const chk=()=>{if(sl.map(i=>L[order[i]]).join('')===L.join('')){step++;hud();beep(880,.3);burst();say('> ¡Orden correcto! Desclasificando…');setTimeout(fin,1400)}else bad('Frase incorrecta. Toca una casilla para quitar una letra.')};
 draw();b.append(sw,tr,el('div','log','> Reúne las letras y forma la orden.'));screen('Nivel 6: La orden final','Con las letras obtenidas, forma la frase: 4 palabras de 3, 1, 3 y 3 letras (sin tildes).',b,'La primera palabra es VAS.')}
// Final
function fin(){const c=el('section','card'),big=el('div','big');('VAS A SER '+tio).split(' ').forEach((w,i)=>{const s=el('span','',w);s.style.animationDelay=i*.4+'s';big.append(s)});
 c.append(el('span','stamp','DESCLASIFICADO'),el('h1','','Misión cumplida, '+nick),big,el('p','','Hay un bebé en camino y tú eres '+(fem?'la tía':'el tío')+' oficial.'+(fecha?' Fecha estimada: '+fecha+'.':'')));
 if(joke)c.append(el('p','','Archivo extra: "'+joke+'"'));c.append(el('p','','Pistas usadas: '+hints+'. Graba tu reacción y mándala.'));
 const b=el('button','go','Copiar mi respuesta');b.onclick=()=>{const t='¡Ya lo sé! Voy a ser '+(fem?'tía':'tío')+' 🍼🎉';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copiado').catch(()=>b.textContent=t)};
 c.append(b);app.replaceChildren(c);hud();[0,200,400,600].forEach((d,i)=>setTimeout(()=>beep(523+i*130,.25,'triangle'),d));
 if(!RM)for(let i=0;i<34;i++){const s=el('span','cf',['🎉','🍼','🧸','⭐'][i%4]);s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*2+'s';document.body.append(s);setTimeout(()=>s.remove(),7000)}}
function next(){[reto1,reto2,reto3,reto4,reto5,reto6][step]()}
// Radio interna (pistas sutiles)
const radio=['Radio interna: alguien dejó un peluche en el archivo.','Compras: 9 cajas de pañuelos "para documentos".','Boletín: el jefe sonríe sin motivo aparente.','Mantenimiento: cambiaron la silla del almacén por una mecedora.','Aviso: silencio después de las 9, alguien duerme.','Cafetería: se acabó el café con cafeína. Misterio.'];let ri=0;
function tick(){const t=$('#tick');t.replaceChildren(el('span','',radio[ri++%radio.length]))}tick();setInterval(tick,5000);
let mx=-999,my=-999;
document.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;const c=$('.card');if(!c||RM)return;const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*8+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*8+'deg')});
(function(){if(RM)return;const cv=$('#fx'),x=cv.getContext('2d');let w,h,ps=[];const rs=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight;ps=Array.from({length:Math.min(70,w/14|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))};rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,w,h);ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const dx=mx-p.x,dy=my-p.y;if(Math.hypot(dx,dy)<140){p.x-=dx*.01;p.y-=dy*.01}x.fillStyle='#5eead4aa';x.fillRect(p.x,p.y,2,2);for(let j=i+1;j<ps.length;j++){const q=ps[j],e=Math.hypot(p.x-q.x,p.y-q.y);if(e<110){x.strokeStyle='rgba(94,234,212,'+(1-e/110)*.35+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(f)})()})();
